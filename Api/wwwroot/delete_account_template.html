<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminación de cuenta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #e6e6e6;
            border-radius: 10px;
            text-align: center;
        }

        .header {
            background-color: #7b1fa2;
            padding: 20px;
            border-radius: 8px;
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .body {
            padding: 20px;
            color: #333;
            font-size: 16px;
        }

        .footer {
            padding: 20px;
            color: #333;
            font-size: 14px;
        }

        .footer-link {
            color: #7b1fa2;
            text-decoration: none;
        }
        
        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cuenta Eliminada</h1>
        </div>
        <div class="body">
            <p>Estimado {{UserName}},</p>
            <p>Lamentamos informarte que tu cuenta ha sido eliminada por los siguientes incumplimientos de conducta: {{DeletionReason}}.</p>
        </div>
        <div class="footer">
            <p>Atentamente,<br>El equipo de RedSelecta</p>
            <p><a href="https://www.redselecta.com/" class="footer-link"> redselecta.com </a></p>
        </div>
    </div>
</body>
</html>
